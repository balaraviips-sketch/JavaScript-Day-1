   <script>
    // Currying & Uncurrying

console.log("1. Currying & Uncurrying");

function add(a){
    return function (b){
        return function(c){
            console.log("Sum :",a+b+c);
        }
    }
}
add(10)(20)(30);

function empdetails (name){
    return function (department){
        return function(salary){
            console.log(`Employee_Name : ${name}, Employee_Department : ${department}, Employee_Salary : ${salary}`);
        }
    }
}
empdetails("Ravi")("Bsc")("62000");

function multiply(x){
    return function(y){
        return function(z){
            console.log("Multiply :",x*y*z);
        }
    }
}
multiply(6)(3)(8)

function curriedadd (a){
    return function (b){
        return function (c){
            return a+b+c;
        }
    }
}
function uncurriedadd(curried){
    return function(a,b,c){
        return curried(a)(b)(c);
    }
}
const uncurry = uncurriedadd(curriedadd);
console.log(uncurry(3,4,5));

function number(a){
    return function(b){
        return function(c){
            return function(d){
                console.log("Curried Version add 4 numbers:",a+b+c+d);
            }
        }
    }
}
number(100)(50)(10)(20)
function number1(a,b,c,d){
    console.log("Uncurried version add 4 numbers :", a+b+c+d);
}
number1(100,50,10,20)
